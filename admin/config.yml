backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "soaps"
    label: "סבונים"
    files:
      - file: "soaps.json"
        label: "רשימת הסבונים"
        name: "soaps_list"
        fields:
          - label: "סבונים"
            name: "soaps"
            widget: "list"
            fields:
              - { label: "מזהה/קטיגוריה", name: "category", widget: "string" }
              - { label: "שם הסבון", name: "title", widget: "string" }
              - { label: "תת-כותרת", name: "tagline", widget: "string" }
              - { label: "תמונה", name: "image", widget: "image" }
              - { label: "הרכב ורכיבים", name: "ingredients", widget: "text" }
              - { label: "סגולות ותכונות (שורות נפרדות)", name: "benefits", widget: "list" }
              - { label: "למי מתאים", name: "suitable_for", widget: "text" }
              - { label: "קישור להזמנה בווטסאפ", name: "whatsapp_link", widget: "string" }
