backend:
  name: github
  repo: tehilachz-netizen/soup_store
  branch: main
  base_url: https://soupstore.vercel.app
  auth_endpoint: api/auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "soaps_collection"
    label: "ניהול סבונים"
    files:
      - label: "רשימת הסבונים בקטלוג"
        name: "soaps_list"
        file: "soaps.json"
        fields:
          - name: "soaps"
            label: "רשימת סבונים"
            widget: "list"
            fields:
              - { label: "מזהה ייחודי (באנגלית)", name: "id", widget: "string" }
              - { label: "שם הסבון", name: "title", widget: "string" }
              - { label: "תיאור קצר (סלוגן)", name: "tagline", widget: "string" }
              - { label: "תמונה", name: "image", widget: "image" }
              - { label: "מחיר רגיל (לדוגמה: 20)", name: "price", widget: "string", required: false }
              - { label: "להציג מחיר מבצע/השקה מיוחד למוצר זה?", name: "show_sale", widget: "boolean", default: false, required: false }
              - { label: "מחיר מיוחד / מבצע (לדוגמה: 18)", name: "sale_price", widget: "string", required: false }
              - { label: "למי מתאים?", name: "suitable_for", widget: "text", required: false }
              - { label: "רכיבים", name: "ingredients", widget: "text" }
              - { label: "סגולות ותכונות", name: "benefits", widget: "list", field: { label: "תכונה / סגולה", name: "benefit", widget: "text" }, required: false }
              - { label: "קישור להזמנה בווטסאפ", name: "whatsapp_link", widget: "string", required: false }

  - name: "settings_collection"
    label: "הגדרות האתר"
    files:
      - label: "כותרות האתר"
        name: "general_settings"
        file: "content/settings.json"
        fields:
          - { label: "כותרת ראשית", name: "site_title", widget: "string" }
          - { label: "כותרת משנה", name: "site_subtitle", widget: "text" }
          - { label: "להציג באנר מבצע/השקה בראש האתר?", name: "show_launch_banner", widget: "boolean", default: true, required: false }
          - { label: "מחיר רגיל מחוק (לדוגמה: ₪20)", name: "original_price", widget: "string", required: false }
          - { label: "מחיר השקה / מבצע (לדוגמה: ₪18)", name: "launch_price", widget: "string", required: false }
          - { label: "טקסט מבצע לזוג (אופציונלי, לדוגמה: | זוג ₪35)", name: "pair_price", widget: "string", required: false }
