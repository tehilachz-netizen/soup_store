backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site_settings"
    label: "הגדרות האתר"
    files:
      - file: "content/settings.json"
        label: "כותרות האתר"
        name: "settings"
        fields:
          - { label: "כותרת ראשית", name: "site_title", widget: "string" }
          - { label: "כותרת משנית", name: "site_subtitle", widget: "string" }

  - name: "soaps"
    label: "סבונים"
    file: "soaps.json"
    extension: "json"
    format: "json"
    fields:
      - { label: "מזהה (ID יחודי באנגלית, למשל: soap-1)", name: "id", widget: "string" }
      - { label: "שם הסבון", name: "name", widget: "string" }
      - { label: "תת-כותרת", name: "subtitle", widget: "string" }
      - { label: "מחיר (בש״ח)", name: "price", widget: "string", default: "35" }
      - { label: "תמונה", name: "image", widget: "image" }
      - { label: "רכיבים", name: "ingredients", widget: "text" }
      - label: "סגולות ותכונות"
        name: "features"
        widget: "list"
        field: { label: "תכונה", name: "feature", widget: "string" }
      - { label: "קישור להזמנה בווטסאפ", name: "whatsapp_link", widget: "string" }
