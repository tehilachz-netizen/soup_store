<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">פרטי סבון</title>

  <!-- טעינת גופני Google Fonts: Frank Ruhl Libre + Rubik -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800&family=Rubik:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #5c6f52;
      --bg: #f9f7f2;
      --text: #2c3529;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rubik', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 20px 0 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, h4, .section-title {
      font-family: 'Frank Ruhl Libre', serif;
    }

    main {
      flex: 1;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .back-link {
      display: inline-block;
      margin: 20px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .product-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      padding: 20px 30px 40px 30px;
    }
    .product-media {
      flex: 1 1 350px;
    }
    .product-media img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
      max-height: 450px;
    }
    .product-details {
      flex: 1 1 400px;
    }
    h1 { font-size: 2.2rem; color: var(--primary); margin-bottom: 5px; }
    .subtitle { font-size: 1.1rem; color: #666; margin-bottom: 15px; }
    .price { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-bottom: 20px; }
    .section-title { font-weight: bold; font-size: 1.2rem; margin-top: 20px; margin-bottom: 8px; border-bottom: 2px solid var(--bg); padding-bottom: 4px; }
    ul { list-style-type: square; padding-right: 20px; }
    li { margin-bottom: 8px; }
    .whatsapp-btn {
      display: inline-block;
      margin-top: 25px;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
      transition: background 0.2s;
    }
    .whatsapp-btn:hover { background-color: #1eb857; }

    /* עיצוב הפוטר בתחתית */
    footer {
      background-color: #eef2e8;
      border-top: 1px solid #dbe3d3;
      padding: 20px;
      text-align: center;
      margin-top: 40px;
      margin-left: -20px;
      margin-right: -20px;
      color: var(--text);
    }
    footer p {
      font-size: 1.05rem;
      font-weight: 500;
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main>
    <div class="container">
      <a href="/" class="back-link">→ חזרה לקטלוג הסבונים</a>

      <div class="product-wrapper" id="product-content">
        <p>טוען נתוני סבון...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>להזמנות: תהילה <a href="tel:0584020823">058-4020823</a> | יובל <a href="tel:0509606144">050-9606144</a></p>
  </footer>

  <script>
    function formatImagePath(imgPath) {
      if (!imgPath) return '/images/default.jpg';
      if (imgPath.startsWith('http://') || imgPath.startsWith('https://')) return imgPath;
      
      let cleanPath = imgPath.startsWith('/') ? imgPath.slice(1) : imgPath;
      if (!cleanPath.startsWith('images/')) {
        cleanPath = 'images/' + cleanPath;
      }
      return '/' + cleanPath.split('/').map(segment => encodeURIComponent(segment)).join('/');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const soapId = urlParams.get('id');

    fetch('/soaps.json')
      .then(res => res.json())
      .then(data => {
        const soaps = Array.isArray(data) ? data : (data.soaps || []);
        
        const soap = soaps.find((item, idx) => item.id === soapId || `soap-${idx + 1}` === soapId) || soaps[0];

        if (!soap) {
          document.getElementById('product-content').innerHTML = '<p>סבון לא נמצא.</p>';
          return;
        }

        const title = soap.title || soap.name;
        const tagline = soap.tagline || soap.subtitle || '';
        const image = formatImagePath(soap.image);
        const benefits = soap.benefits || soap.features || [];

        document.getElementById('page-title').innerText = `${title} | סבון טבעי`;

        let benefitsHtml = '';
        if (benefits.length) {
          benefitsHtml = `
            <div class="section-title">סגולות ותכונות:</div>
            <ul>
              ${benefits.map(b => `<li>${typeof b === 'object' ? (b.feature || Object.values(b)[0]) : b}</li>`).join('')}
            </ul>
          `;
        }

        document.getElementById('product-content').innerHTML = `
          <div class="product-media">
            <img src="${image}" alt="${title}" onerror="this.src='/images/default.jpg'">
          </div>
          <div class="product-details">
            <h1>${title}</h1>
            <div class="subtitle">${tagline}</div>
            ${soap.price ? `<div class="price">₪${soap.price}</div>` : ''}

            ${soap.suitable_for ? `
              <div class="section-title">למי זה מתאים?</div>
              <p>${soap.suitable_for}</p>
            ` : ''}

            ${soap.ingredients ? `
              <div class="section-title">רכיבים:</div>
              <p>${soap.ingredients}</p>
            ` : ''}

            ${benefitsHtml}

            ${soap.whatsapp_link ? `
              <a href="${soap.whatsapp_link}" target="_blank" class="whatsapp-btn">להזמנה בווטסאפ</a>
            ` : ''}
          </div>
        `;
      })
      .catch(err => {
        console.error(err);
        document.getElementById('product-content').innerHTML = '<p>שגיאה בטעינת הפרטים.</p>';
      });
  </script>
</body>
</html>
