<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סבונים טבעיים | קטלוג מוצרים</title>

  <!-- טעינת גופני Google Fonts: Frank Ruhl Libre + Rubik -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800&family=Rubik:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #5c6f52;
      --bg: #f9f7f2;
      --text: #2c3529;
      --card-bg: #ffffff;
      --accent: #8b9d77;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Rubik', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    h1, h2, h3, h4, .product-title {
      font-family: 'Frank Ruhl Libre', serif;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto 30px auto;
    }
    header h1 {
      font-size: 2.7rem;
      color: var(--primary);
      margin-bottom: 10px;
    }
    header p {
      font-size: 1.2rem;
      color: #666;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden; /* שומר שהתמונה המוגדלת לא תגלוש מחוץ לפינות המעוגלות */
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    /* עיצוב התמונה ואפקט ההגדלה */
    .product-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      object-position: center;
      display: block;
      margin: 0 auto;
      background-color: #eee;
      transition: transform 0.4s ease; /* מעבר חלק של 0.4 שניות להגדלה */
    }

    /* הגדלה עדין של התמונה כשהעכבר נמצא על כרטיסיית המוצר */
    .product-card:hover .product-image {
      transform: scale(1.06); /* הגדלה עדינות של 6% בלבד */
    }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      text-align: center;
    }
    .product-title {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .product-subtitle {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 15px;
      flex-grow: 1;
    }
    .product-price {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .view-btn {
      background-color: var(--primary);
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .product-card:hover .view-btn {
      background-color: #4a5a41; /* הכהיית הכפתור בלחיצה/מעבר עכבר */
    }
  </style>
</head>
<body>

  <header>
    <h1 id="site-title">סבוני גוף טבעיים</h1>
    <p id="site-subtitle">טוען...</p>
  </header>

  <main class="catalog-grid" id="catalog-container">
    <p style="text-align: center; grid-column: 1 / -1;">טוען מוצרים...</p>
  </main>

  <script>
    fetch('/content/settings.json')
      .then(res => res.ok ? res.json() : null)
      .then(settings => {
        if (settings && settings.site_title) document.getElementById('site-title').innerText = settings.site_title;
        if (settings && settings.site_subtitle) {
          document.getElementById('site-subtitle').innerText = settings.site_subtitle;
        } else {
          document.getElementById('site-subtitle').innerText = 'סבונים טבעיים בעבודת יד מרכיבים איכותיים';
        }
      })
      .catch(() => {
        document.getElementById('site-subtitle').innerText = 'סבונים טבעיים בעבודת יד מרכיבים איכותיים';
      });

    function formatImagePath(imgPath) {
      if (!imgPath) return '/images/default.jpg';
      if (imgPath.startsWith('http://') || imgPath.startsWith('https://')) return imgPath;
      
      let cleanPath = imgPath.startsWith('/') ? imgPath.slice(1) : imgPath;
      if (!cleanPath.startsWith('images/')) {
        cleanPath = 'images/' + cleanPath;
      }
      return '/' + cleanPath.split('/').map(segment => encodeURIComponent(segment)).join('/');
    }

    fetch('/soaps.json')
      .then(res => {
        if (!res.ok) throw new Error('soaps.json not found');
        return res.json();
      })
      .then(data => {
        const container = document.getElementById('catalog-container');
        container.innerHTML = '';

        const soaps = Array.isArray(data) ? data : (data.soaps || []);

        if (soaps.length === 0) {
          container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">אין מוצרים להצגה כרגע.</p>';
          return;
        }

        soaps.forEach((soap, index) => {
          const soapId = soap.id || `soap-${index + 1}`;
          const soapTitle = soap.title || soap.name || 'סבון טבעי';
          const soapTagline = soap.tagline || soap.subtitle || '';
          const soapImage = formatImagePath(soap.image);
          const soapPrice = soap.price ? `₪${soap.price}` : '';

          const card = document.createElement('a');
          card.className = 'product-card';
          card.href = `/product.html?id=${encodeURIComponent(soapId)}`;

          card.innerHTML = `
            <img class="product-image" src="${soapImage}" alt="${soapTitle}" onerror="this.src='/images/default.jpg'">
            <div class="product-info">
              <h2 class="product-title">${soapTitle}</h2>
              <p class="product-subtitle">${soapTagline}</p>
              ${soapPrice ? `<div class="product-price">${soapPrice}</div>` : ''}
              <div class="view-btn">לפרטים מלאים והזמנה</div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Error loading soaps:', err);
        document.getElementById('catalog-container').innerHTML = '<p style="text-align: center; grid-column: 1/-1;">שגיאה בטעינת המוצרים.</p>';
      });
  </script>
</body>
</html>
