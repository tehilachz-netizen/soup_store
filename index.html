<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סבוני גוף טבעיים | קטלוג מוצרים</title>

  <!-- טעינת גופני Google Fonts: Frank Ruhl Libre + Rubik -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800&family=Rubik:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #b37554;
      --primary-hover: #8c5332;
      --bg: #fcf9f4;
      --text: #2b221e;
      --card-bg: #ffffff;
      --accent: #d8a07c;
      --banner-bg: #f2e5d8;
      --footer-bg: #f3ece1;
      --footer-border: #e2d3c1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Rubik', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 20px 0 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, h4, .product-title {
      font-family: 'Frank Ruhl Libre', serif;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    header h1 {
      font-size: 2.7rem;
      color: var(--primary);
      margin-bottom: 10px;
    }
    header p {
      font-size: 1.15rem;
      color: #615249;
      margin-bottom: 6px;
    }

    /* עיצוב באנר מחירים ומבצעים */
    .promo-banner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding: 8px 22px;
      background-color: var(--banner-bg);
      color: var(--primary-hover);
      font-weight: 600;
      font-size: 1.15rem;
      border-radius: 25px;
      border: 1px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* עיצוב המחיר המקורי שנמחק בקו */
    .strikethrough-price {
      text-decoration: line-through;
      color: #8c7161;
      font-weight: 400;
      font-size: 1.05rem;
      margin-right: 2px;
      margin-left: 6px;
      opacity: 0.85;
    }

    .sale-highlight {
      font-weight: 700;
      color: var(--primary-hover);
    }

    main {
      flex: 1;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 30px auto 50px auto;
    }
    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .product-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      object-position: center;
      display: block;
      margin: 0 auto;
      background-color: #eee;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.06);
    }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      text-align: center;
    }
    .product-title {
      font-size: 1.5rem;
      color: var(--primary-hover);
      margin-bottom: 8px;
    }
    .product-subtitle {
      font-size: 0.95rem;
      color: #66574e;
      margin-bottom: 15px;
      flex-grow: 1;
    }
    .product-price {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--primary-hover);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .view-btn {
      background-color: var(--primary);
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .product-card:hover .view-btn {
      background-color: var(--primary-hover);
    }

    /* עיצוב הפוטר בתחתית */
    footer {
      background-color: var(--footer-bg);
      border-top: 1px solid var(--footer-border);
      padding: 20px;
      text-align: center;
      margin-top: 40px;
      margin-left: -20px;
      margin-right: -20px;
      color: var(--text);
    }
    footer p {
      font-size: 1.05rem;
      font-weight: 500;
    }
    footer a {
      color: var(--primary-hover);
      text-decoration: none;
      font-weight: bold;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="site-title">סבוני גוף טבעיים</h1>
    <p id="site-subtitle">טוען...</p>
    
    <div class="promo-banner" id="site-promo" style="display: none;">
      <span>מחיר השקה: יחידה</span>
      <span class="sale-highlight" id="launch-price-val">₪18</span>
      <span class="strikethrough-price" id="orig-price-val" style="display: none;">₪20</span>
      <span id="pair-price-val">| זוג ₪35</span>
    </div>
  </header>

  <main>
    <div class="catalog-grid" id="catalog-container">
      <p style="text-align: center; grid-column: 1 / -1;">טוען מוצרים...</p>
    </div>
  </main>

  <footer>
    <p>להזמנות: תהילה <a href="tel:0584020823">058-4020823</a> | יובל <a href="tel:0509606144">050-9606144</a></p>
  </footer>

  <script>
    fetch('/content/settings.json')
      .then(res => res.ok ? res.json() : null)
      .then(settings => {
        if (settings && settings.site_title) document.getElementById('site-title').innerText = settings.site_title;
        if (settings && settings.site_subtitle) {
          document.getElementById('site-subtitle').innerText = settings.site_subtitle;
        } else {
          document.getElementById('site-subtitle').innerText = 'סבונים איכותיים משמנים טבעיים עם שמנים אתריים שונים, למי שרוצה להתפנק או לפנק';
        }
        
        const promoContainer = document.getElementById('site-promo');

        // בדיקה אם המשתמש בחר להציג את באנר ההשקה
        if (settings && settings.show_launch_banner !== false) {
          promoContainer.style.display = 'inline-flex';

          if (settings.launch_price) {
            document.getElementById('launch-price-val').innerText = settings.launch_price;
          }

          if (settings.original_price) {
            const origEl = document.getElementById('orig-price-val');
            origEl.innerText = settings.original_price;
            origEl.style.display = 'inline';
          }

          if (settings.pair_price !== undefined) {
            document.getElementById('pair-price-val').innerText = settings.pair_price;
          }
        } else {
          promoContainer.style.display = 'none';
        }
      })
      .catch(() => {
        document.getElementById('site-subtitle').innerText = 'סבונים איכותיים משמנים טבעיים עם שמנים אתריים שונים, למי שרוצה להתפנק או לפנק';
      });

    function formatImagePath(imgPath) {
      if (!imgPath) return '/images/default.jpg';
      if (imgPath.startsWith('http://') || imgPath.startsWith('https://')) return imgPath;
      
      let cleanPath = imgPath.startsWith('/') ? imgPath.slice(1) : imgPath;
      if (!cleanPath.startsWith('images/')) {
        cleanPath = 'images/' + cleanPath;
      }
      return '/' + cleanPath.split('/').map(segment => encodeURIComponent(segment)).join('/');
    }

    fetch('/soaps.json')
      .then(res => {
        if (!res.ok) throw new Error('soaps.json not found');
        return res.json();
      })
      .then(data => {
        const container = document.getElementById('catalog-container');
        container.innerHTML = '';

        const soaps = Array.isArray(data) ? data : (data.soaps || []);

        if (soaps.length === 0) {
          container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">אין מוצרים להצגה כרגע.</p>';
          return;
        }

        soaps.forEach((soap, index) => {
          const soapId = soap.id || `soap-${index + 1}`;
          const soapTitle = soap.title || soap.name || 'סבון טבעי';
          const soapTagline = soap.tagline || soap.subtitle || '';
          const soapImage = formatImagePath(soap.image);

          // יצירת תצוגת מחיר מותאמת לפי הגדרות המבצע של המוצר
          let priceHtml = '';
          if (soap.show_sale && soap.sale_price) {
            priceHtml = `
              <div class="product-price">
                <span class="sale-highlight">₪${soap.sale_price}</span>
                ${soap.price ? `<span class="strikethrough-price">₪${soap.price}</span>` : ''}
              </div>
            `;
          } else if (soap.price) {
            priceHtml = `<div class="product-price">₪${soap.price}</div>`;
          }

          const card = document.createElement('a');
          card.className = 'product-card';
          card.href = `/product.html?id=${encodeURIComponent(soapId)}`;

          card.innerHTML = `
            <img class="product-image" src="${soapImage}" alt="${soapTitle}" onerror="this.src='/images/default.jpg'">
            <div class="product-info">
              <h2 class="product-title">${soapTitle}</h2>
              <p class="product-subtitle">${soapTagline}</p>
              ${priceHtml}
              <div class="view-btn">לפרטים מלאים והזמנה</div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Error loading soaps:', err);
        document.getElementById('catalog-container').innerHTML = '<p style="text-align: center; grid-column: 1/-1;">שגיאה בטעינת המוצרים.</p>';
      });
  </script>
</body>
</html>
