<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סבונים טבעיים | קטלוג מוצרים</title>
  <style>
    :root {
      --primary: #5c6f52;
      --bg: #f9f7f2;
      --text: #2c3529;
      --card-bg: #ffffff;
      --accent: #8b9d77;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto 30px auto;
    }
    header h1 {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 10px;
    }
    header p {
      font-size: 1.2rem;
      color: #666;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .product-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background-color: #eee;
    }
    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .product-title {
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .product-subtitle {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 15px;
      flex-grow: 1;
    }
    .product-price {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .view-btn {
      background-color: var(--primary);
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="site-title">סבוני גוף טבעיים</h1>
    <p id="site-subtitle">טוען...</p>
  </header>

  <main class="catalog-grid" id="catalog-container">
    <p style="text-align: center; grid-column: 1 / -1;">טוען מוצרים...</p>
  </main>

  <script>
    // טעינת כותרות האתר בבטחה
    fetch('/content/settings.json')
      .then(res => {
        if (!res.ok) throw new Error('Settings file not found');
        return res.json();
      })
      .then(settings => {
        if (settings.site_title) document.getElementById('site-title').innerText = settings.site_title;
        if (settings.site_subtitle) {
          document.getElementById('site-subtitle').innerText = settings.site_subtitle;
        } else {
          document.getElementById('site-subtitle').innerText = 'סבונים טבעיים בעבודת יד מרכיבים איכותיים';
        }
      })
      .catch(err => {
        console.log('Using default subtitle');
        document.getElementById('site-subtitle').innerText = 'סבונים טבעיים בעבודת יד מרכיבים איכותיים';
      });

    // טעינת קטלוג הסבונים
    fetch('/soaps.json')
      .then(res => res.json())
      .then(soaps => {
        const container = document.getElementById('catalog-container');
        container.innerHTML = '';

        soaps.forEach((soap, index) => {
          const soapId = soap.id || `soap-${index + 1}`;
          const card = document.createElement('a');
          card.className = 'product-card';
          card.href = `/product.html?id=${encodeURIComponent(soapId)}`;

          card.innerHTML = `
            <img class="product-image" src="${soap.image || '/images/default.jpg'}" alt="${soap.name}">
            <div class="product-info">
              <h2 class="product-title">${soap.name}</h2>
              <p class="product-subtitle">${soap.subtitle || ''}</p>
              ${soap.price ? `<div class="product-price">₪${soap.price}</div>` : ''}
              <div class="view-btn">לפרטים מלאים והזמנה</div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Error loading soaps:', err);
        document.getElementById('catalog-container').innerHTML = '<p style="text-align: center; grid-column: 1/-1;">שגיאה בטעינת המוצרים.</p>';
      });
  </script>
</body>
</html>
